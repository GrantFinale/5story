<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="cspeed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cspeed2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="cgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#00f0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="cchecker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#00f0ff" fill-opacity="0.85"/>
      <rect x="10" y="10" width="10" height="10" fill="#00f0ff" fill-opacity="0.85"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#cbg)"/>
  <rect width="640" height="360" fill="url(#cgrid)"/>
  <g>
    <rect x="0" y="100" width="640" height="4" fill="url(#cspeed)"/>
    <rect x="0" y="140" width="640" height="2" fill="url(#cspeed2)"/>
    <rect x="0" y="180" width="640" height="6" fill="url(#cspeed)" opacity="0.8"/>
    <rect x="0" y="220" width="640" height="2" fill="url(#cspeed2)"/>
    <rect x="0" y="260" width="640" height="4" fill="url(#cspeed)" opacity="0.7"/>
  </g>
  <g transform="translate(60 220)" opacity="0.9">
    <rect x="0" y="0" width="60" height="80" fill="url(#cchecker)" transform="skewX(-18)"/>
    <line x1="0" y1="0" x2="-30" y2="0" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
  </g>
  <g transform="translate(420 150)" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-opacity="0.7">
    <polyline points="0,80 20,60 40,70 60,40 80,50 100,20 120,30 140,10"/>
    <circle cx="140" cy="10" r="4" fill="#8b5cf6" fill-opacity="0.9"/>
    <line x1="0" y1="85" x2="140" y2="85" stroke-opacity="0.2"/>
  </g>
  <g font-family="'Orbitron', monospace" font-weight="900" fill="#e0e8f0">
    <text x="32" y="60" font-size="14" letter-spacing="4" fill-opacity="0.9">RACER&#xA0;DASH</text>
    <text x="32" y="80" font-size="8" letter-spacing="2" fill="#00f0ff" fill-opacity="0.7">// SPLITS / PACE / PR</text>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#00f0ff">
    <text x="32" y="320" letter-spacing="2" fill-opacity="0.9">05:42</text>
    <text x="32" y="340" font-size="8" fill="#8b5cf6" fill-opacity="0.7" letter-spacing="2">PACE/MI</text>
  </g>
</svg>
